# Déploiement Pages par le RÉUTILISABLE du socle, et plus à la main.
#
# Écrit à la main, ce workflow n'avait ni le repli SPA `404.html`, ni
# `required-env`, ni la base de chemin calculée — `pwa-doctor` le comptait en
# dette. Le réutilisable pose lui-même `VITE_BASE_PATH` et
# `VITE_PUBLIC_SITE_ORIGIN` ; les autres `VITE_*` passent par `build-env`.
#
# LES MIGRATIONS PASSENT D'ABORD, dans leur propre tâche : un bundle qui lirait
# un schéma pas encore migré casserait en production. Le déploiement attend
# qu'elles aboutissent.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: read

# PAS DE `concurrency` AU NIVEAU DU WORKFLOW. Le réutilisable prend déjà le
# groupe `pages` pour lui-même : un appelant qui le prend aussi attend ce que
# l'appelé veut obtenir, et GitHub rejette le run au démarrage (« workflow file
# issue ») — sur `push`, sans même en lister un. C'est ce qui a empêché le
# premier déploiement par le réutilisable, le 25/09/2026.

jobs:
  migrate:
    runs-on: ubuntu-latest
    # Les migrations dans leur propre file, et SANS annulation : une seconde
    # poussée attend la fin de la première au lieu de l'interrompre à mi-schéma.
    concurrency:
      group: supabase-migrate
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: mister-guiiug/dev-pwa-config/.github/actions/supabase-migrate@v6
        with:
          access-token: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          project-id: ${{ vars.SUPABASE_PROJECT_ID }}
          db-password: ${{ secrets.SUPABASE_DB_PASSWORD }}

  deploy:
    needs: migrate
    uses: mister-guiiug/dev-pwa-config/.github/workflows/pwa-deploy.yml@v6
    with:
      use-base-path: true
      build-env: |
        VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY=${{ vars.VITE_SUPABASE_ANON_KEY }}
        VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
        VITE_POSTHOG_KEY=${{ vars.VITE_POSTHOG_KEY }}
      # Sans Supabase, l'app publiée ne sait rien faire : mieux vaut arrêter
      # le déploiement que publier ce bundle-là.
      required-env: |
        VITE_SUPABASE_URL
        VITE_SUPABASE_ANON_KEY
