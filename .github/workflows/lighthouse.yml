# Lighthouse délégué au reusable workflow famille (dev-pwa-config).
# `build-env` fournit des VITE_SUPABASE_* factices : `src/lib/supabase.ts` appelle
# `createClient()` au chargement du module, et supabase-js lève
# « supabaseUrl is required. » sur une URL vide — la page ne peignait alors jamais
# rien (Lighthouse NO_FCP) et le garde-fou d'accessibilité ne mesurait plus rien.
name: Lighthouse

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pull-requests: write

jobs:
  lighthouse:
    uses: mister-guiiug/dev-pwa-config/.github/workflows/pwa-lighthouse.yml@v4
    # PAS de `secrets: inherit` : ce workflow n'en déclare aucun, et
    # `GITHUB_TOKEN` lui est fourni d'office. Hériter enverrait TOUS les
    # secrets du dépôt à un workflow qui n'en demande pas un seul.
    with:
      # Valeurs factices, jamais des secrets : Lighthouse audite la page
      # d'accueil, aucun appel Supabase n'aboutit ni n'est nécessaire.
      build-env: |
        VITE_SUPABASE_URL=https://dummy-ci.supabase.co
        VITE_SUPABASE_ANON_KEY=ci-dummy-anon-key
