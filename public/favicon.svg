<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512" role="img" aria-label="Miss Carbook">
  <title>Miss Carbook</title>
  <!--
    LA SOURCE UNIQUE de toute l'identité visuelle de Miss Carbook : ce fichier
    est à la fois servi au navigateur ET rastérisé en tous les PNG du dossier.

    Il est SANS FOND, exprès. Les icônes carrées reçoivent le leur à la
    rastérisation (`flatten` sur `#f8fafc`, le `background_color` du
    manifeste) ; les deux usages où le fond n'est pas le nôtre le gardent
    transparent :
     · l'onglet du navigateur, dont la barre peut être claire ou sombre ;
     · `logo.png`, posé dans l'en-tête de l'application, qui a ses deux thèmes.

    Écu teal `#0f766e` cerné d'un contour blanc, portant une voiture blanche.
    L'écu est calé à 0,79 pour que son bord extérieur tombe à 25,2 unités du
    centre sur une grille de 64 — sous les 25,6 du disque sûr d'Android. Le
    monter le ferait rogner en `maskable`.

    C'EST ICI QUE LE CONTOUR BLANC GAGNE SA PLACE. Sur fond clair il est
    invisible et l'écu se détache par sa propre couleur ; sur fond sombre c'est
    lui, et lui seul, qui sépare le teal du noir — mesuré, l'écu ne rend que
    3,1:1 contre `#0f172a`, le thème nuit.

    Le contour est obtenu en dessinant la forme deux fois (blanc avec `stroke`
    blanc, puis teal par-dessus) : `paint-order` aurait été plus court mais
    librsvg, le moteur de `sharp`, ne le rend pas.

    Le commentaire est À L'INTÉRIEUR de `<svg>` : placé avant la balise racine,
    il fait échouer la détection de format de `sharp`.

    Régénérer `logo.png` depuis ce fichier : `npm run icons`.
  -->

  <g transform="translate(32 32.5) scale(0.79) translate(-32 -32.5)">
    <path
      d="M32 5C29.8 8.9 25.6 10.6 20.6 10.1C17.4 9.8 14.2 9.6 12 9.8C9.7 10 8.4 12.3 9.1 14.5C11.4 22 12.1 30.2 11.2 38C10.2 46.6 14.6 50.9 21.9 54.5C26 56.5 29.6 57.8 32 60C34.4 57.8 38 56.5 42.1 54.5C49.4 50.9 53.8 46.6 52.8 38C51.9 30.2 52.6 22 54.9 14.5C55.6 12.3 54.3 10 52 9.8C49.8 9.6 46.6 9.8 43.4 10.1C38.4 10.6 34.2 8.9 32 5Z"
      fill="#ffffff" stroke="#ffffff" stroke-width="7.5" stroke-linejoin="round"/>
    <path
      d="M32 5C29.8 8.9 25.6 10.6 20.6 10.1C17.4 9.8 14.2 9.6 12 9.8C9.7 10 8.4 12.3 9.1 14.5C11.4 22 12.1 30.2 11.2 38C10.2 46.6 14.6 50.9 21.9 54.5C26 56.5 29.6 57.8 32 60C34.4 57.8 38 56.5 42.1 54.5C49.4 50.9 53.8 46.6 52.8 38C51.9 30.2 52.6 22 54.9 14.5C55.6 12.3 54.3 10 52 9.8C49.8 9.6 46.6 9.8 43.4 10.1C38.4 10.6 34.2 8.9 32 5Z"
      fill="#0f766e"/>
  </g>

  <g transform="translate(32 31.5) scale(0.475) translate(-32 -32.5)">
    <path d="M8 40v-6.5c0-1.6 1.1-3 2.7-3.3l6.3-1.2 6-8.4Q24.5 18 27.9 18h10.6q3.4 0 4.8 2.1l6.1 8.1 6 1.7c1.5.4 2.6 1.8 2.6 3.4V40z" fill="#ffffff"/>
    <path d="M24.5 28.5l4.3-6q.6-.8 1.5-.8h2.9v6.8z" fill="#0f766e"/>
    <path d="M35.2 21.7h3.4q.9 0 1.5.8l4.3 6h-9.2z" fill="#0f766e"/>
    <circle cx="20.5" cy="40" r="8" fill="#0f766e"/>
    <circle cx="44.5" cy="40" r="8" fill="#0f766e"/>
    <circle cx="20.5" cy="41" r="6" fill="#ffffff"/>
    <circle cx="44.5" cy="41" r="6" fill="#ffffff"/>
    <circle cx="20.5" cy="41" r="2.3" fill="#0f766e"/>
    <circle cx="44.5" cy="41" r="2.3" fill="#0f766e"/>
  </g>
</svg>
