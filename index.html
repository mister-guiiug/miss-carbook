<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!--
      LA CSP EST POSÉE AU BUILD PAR `cspPlugin` (vite.config.ts), plus ici.
      Elle vivait dans ce fichier, recopiée à la main : le 19/09/2026 le socle
      a ouvert `connect-src` à l'hôte du DSN Sentry pour tout le parc, et cette
      app ne l'a pas reçu — aucune montée de paquet n'atteint une chaîne de
      caractères. Le greffon apporte en prime `script-src` par HASH des scripts
      inline en production, là où cette balise gardait `'unsafe-inline'`.
    -->
    <meta
      name="google-site-verification"
      content="iUfQ7_dOztC3XoSGesC2b7IkxyNL2O9fegKXECoOg30"
    />
    <!-- Aucune mesure d'audience n'est injectée ici : `ConsentBanner`
         (src/App.tsx) charge PostHog depuis le navigateur, et seulement après
         l'accord. Voir le bloc `__ANALYTICS_*__` plus bas. -->
    <!-- Le script anti-FOUC est injecté en tête de <head> par pwaSeoPlugin()
         (option themeBoot, @mister-guiiug/dev-pwa-config/theme-boot) : clé
         dwc_theme, migration depuis l'ancienne clé mc-theme. Il est inline,
         donc couvert par le 'unsafe-inline' de script-src ci-dessus. -->
    <!--
      LES MARQUEURS `__ANALYTICS_*__` ONT ÉTÉ RETIRÉS.

      `pwaSeoPlugin` les remplaçait AU BUILD par le tag de Google dès
      qu'un identifiant était posé — précédé d'un `consent default` tout
      refusé, donc sans collecte, mais le script partait quand même au
      chargement de la page.

      `ConsentBanner`, monté depuis la campagne de mesure, fait le même
      travail autrement : il n'injecte RIEN avant l'accord. Garder les deux
      chemins ferait partir DEUX tags le jour où la variable serait posée.
      Le socle porte deux réponses à la même question ; cette app
      n'en garde qu'une.
    -->
    <!-- `%BASE_URL%` et pas `/` : le site est servi sous `/miss-carbook/` sur
         GitHub Pages, où un chemin absolu part de la racine du domaine et
         tombe en 404. La balise apple-touch ci-dessous le faisait déjà bien,
         celle-ci était la seule à l'oublier.
         Le SVG d'abord : les navigateurs qui le gèrent le préfèrent, et il
         reste net à toutes les tailles. Le PNG sert de repli. -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="icon" type="image/png" href="%BASE_URL%logo.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <meta name="theme-color" content="#0f766e" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta
      name="description"
      content="Choisissez votre prochaine voiture à plusieurs : espaces partagés, critères, assistant de choix et comparaison des véhicules en temps réel. Gratuit."
    />
    <link rel="canonical" href="__SEO_HOME_URL__" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Miss Carbook" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="__SEO_HOME_URL__" />
    <meta
      property="og:title"
      content="Miss Carbook — choisir sa voiture à plusieurs"
    />
    <meta
      property="og:description"
      content="Choisissez votre prochaine voiture à plusieurs : espaces partagés, critères, assistant de choix et comparaison des véhicules en temps réel. Gratuit."
    />
    <meta property="og:image" content="__SEO_LOGO_URL__" />

    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="Miss Carbook — choisir sa voiture à plusieurs"
    />
    <meta
      name="twitter:description"
      content="Choisissez votre prochaine voiture à plusieurs : espaces partagés, critères, assistant de choix et comparaison des véhicules en temps réel. Gratuit."
    />
    <meta name="twitter:image" content="__SEO_LOGO_URL__" />
    <title>Miss Carbook — choisir sa voiture à plusieurs</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
