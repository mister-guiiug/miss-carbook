<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!--
      Content-Security-Policy en défense en profondeur.
      'unsafe-inline' : styles Tailwind/vite-plugin-pwa + snippet GTM injecté
      au build. connect-src : Supabase (https + wss) et GA4/GTM.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://www.googletagmanager.com https://*.google-analytics.com; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; frame-src https://www.googletagmanager.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    />
    <meta
      name="google-site-verification"
      content="iUfQ7_dOztC3XoSGesC2b7IkxyNL2O9fegKXECoOg30"
    />
    <!-- Analytics (GTM) injecté par pwaSeoPlugin() au build. -->
    <!-- Le script anti-FOUC est injecté en tête de <head> par pwaSeoPlugin()
         (option themeBoot, @mister-guiiug/dev-wpa-config/theme-boot) : clé
         dwc_theme, migration depuis l'ancienne clé mc-theme. Il est inline,
         donc couvert par le 'unsafe-inline' de script-src ci-dessus. -->
    __ANALYTICS_HEAD__
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <meta name="theme-color" content="#0f766e" />
    <link rel="apple-touch-icon" href="%BASE_URL%pwa-192.png" />
    <meta
      name="description"
      content="Carnet collaboratif pour choisir votre prochain véhicule — PWA."
    />
    <link rel="canonical" href="__SEO_HOME_URL__" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Miss Carbook" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="__SEO_HOME_URL__" />
    <meta
      property="og:title"
      content="Miss Carbook — comparatif collaboratif de véhicules"
    />
    <meta
      property="og:description"
      content="Carnet collaboratif pour choisir votre prochain véhicule, en temps réel (PWA)."
    />
    <meta property="og:image" content="__SEO_LOGO_URL__" />

    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="Miss Carbook — comparatif collaboratif de véhicules"
    />
    <meta
      name="twitter:description"
      content="Comparatif collaboratif de véhicules, en temps réel (PWA)."
    />
    <meta name="twitter:image" content="__SEO_LOGO_URL__" />
    <title>Miss Carbook</title>
  </head>
  <body>
    __ANALYTICS_BODY__
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
